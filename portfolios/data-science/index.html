<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luís Silva | Portfólio de Ciência de Dados</title>
    <meta name="description" content="Projetos de Machine Learning, estatística, NLP, visão computacional, séries temporais e MLOps para gerar valor em produtos e negócios.">
    <meta name="author" content="Luís Silva">
    <meta name="theme-color" content="#05080f">

    <link rel="icon" href="../../assets/img/favicon.png" type="image/png">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../../assets/css/portfolio.css?v=2">
</head>
<body class="theme-data-science">
    <div class="portfolio-container">
        <aside class="sidebar">
            <a href="../../index.html" class="back-button" aria-label="Voltar ao início">
                <span class="back-icon" aria-hidden="true"><i class="fas fa-arrow-left"></i></span>
                <span class="back-text">Voltar ao Início</span>
            </a>

            <div class="profile">
                <img src="../../assets/img/luis-silva-perfil.png" alt="Foto de Luís Silva" class="profile-photo" width="128" height="128">
                <h1>Luís Silva</h1>
                <p>Ciência de Dados</p>
            </div>

            <nav class="sidebar-nav" aria-label="Links do perfil">
                <a href="https://www.linkedin.com/in/luissilvak" target="_blank" rel="noopener">
                    <i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn
                </a>
                <a href="https://github.com/LuiSilvak" target="_blank" rel="noopener">
                    <i class="fab fa-github" aria-hidden="true"></i> GitHub
                </a>
                <a href="../../docs/Luis_Silva_Curriculo.pdf" target="_blank" rel="noopener">
                    <i class="fas fa-file-pdf" aria-hidden="true"></i> Currículo
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <span class="page-eyebrow">Portfólio</span>
                <h2>Portfólio de Ciência de Dados</h2>
                <p>Projetos de Machine Learning, estatística, NLP, visão computacional, séries temporais e MLOps para gerar valor em produtos e negócios.</p>
            </header>

            <div class="controls">
                <div class="filters" role="group" aria-label="Filtrar projetos">
                    <button class="filter-btn active" data-filter="todos">Todos</button>
                    <button class="filter-btn" data-filter="Python">Python</button>
                    <button class="filter-btn" data-filter="Machine Learning">Machine Learning</button>
                    <button class="filter-btn" data-filter="NLP">NLP</button>
                </div>
                <div class="search-wrap">
                    <i class="fas fa-magnifying-glass search-icon" aria-hidden="true"></i>
                    <input type="text" id="searchInput" placeholder="Pesquisar projeto..." aria-label="Pesquisar projeto">
                </div>
            </div>

            <section id="projects-grid" class="projects-grid" aria-live="polite"></section>
        </main>
    </div>

    <div id="projectModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="close-button" aria-label="Fechar">&times;</button>
            <h3 id="modalTitle"></h3>
            <p id="modalDescription"></p>
            <div class="modal-body"></div>
            <div id="modalLinks" class="modal-links"></div>
        </div>
    </div>

    <script type="module" src="./js/script.js?v=2"></script>
</body>
</html>
